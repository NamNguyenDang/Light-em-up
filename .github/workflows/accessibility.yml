name: Accessibility regression
on:
  pull_request:
  push:
    branches: [main, 'accessibility/fr-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chrome
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==6.0.2
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Use runner-provided Chrome (record version)
        run: google-chrome --version
      - name: Database ownership enforcement
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$migration"; done
          for test in supabase/tests/*.sql; do if [ "$test" != supabase/tests/bootstrap.sql ]; then psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$test"; fi; done
      - run: python3 scripts/requirement-traceability.py
      - run: npm test
      - run: node scripts/session-test.mjs
      - run: node scripts/signin-test.mjs
      - run: node scripts/release-preflight-test.mjs
      - run: node scripts/candle-entry-test.mjs
      - run: node scripts/draft-test.mjs
      - run: npm run test:a11y
      - run: node scripts/session-browser-test.mjs
      - run: node scripts/signin-browser-test.mjs
      - run: node scripts/account-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
