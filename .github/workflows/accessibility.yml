name: Accessibility regression
on:
  pull_request:
  push:
    branches: [main, 'accessibility/fr-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==6.0.2
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node scripts/session-test.mjs
      - run: node scripts/signin-test.mjs
      - run: node scripts/candle-entry-test.mjs
      - run: npm run test:a11y
      - run: node scripts/session-browser-test.mjs
      - run: node scripts/signin-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
